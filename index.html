<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--board:#2C4A3D;--chalk:#F2EFE6;--yellow:#F3D46B;--pink:#F2A2B6;--paper:#FBF8F0;--omr:#C23A43;--ink:#1D1D22;--hand:"Gaegu","Nanum Pen Script",cursive;--pen:"Nanum Pen Script","Gaegu",cursive;--print:"Gowun Batang","Noto Serif KR","AppleMyungjo",serif;--ui:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;--grain:none;--grainL:none;--dust:none;--smudge:none}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--ui);color:var(--chalk);word-break:keep-all;background:radial-gradient(120% 90% at 50% 42%,#E4DED0 0,#D3CCBB 70%,#C7BFAC 100%)}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px dashed var(--yellow);outline-offset:4px}
.sv{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.chalky{-webkit-mask-image:var(--grain);mask-image:var(--grain);-webkit-mask-size:150px;mask-size:150px}
.chalkL{-webkit-mask-image:var(--grainL);mask-image:var(--grainL);-webkit-mask-size:150px;mask-size:150px}
.glow{text-shadow:0 0 1px currentColor,0 0 7px rgba(255,255,255,.12)}

#view{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
#view.grabbing{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
#frame{position:absolute;border-radius:3px;overflow:hidden;background-color:var(--board);background-image:var(--dust),var(--smudge),radial-gradient(40% 30% at 22% 24%,rgba(255,255,255,.075),transparent 70%),radial-gradient(34% 26% at 80% 62%,rgba(255,255,255,.06),transparent 70%),radial-gradient(30% 22% at 46% 92%,rgba(255,255,255,.05),transparent 70%),repeating-linear-gradient(-9deg,rgba(255,255,255,.014) 0 40px,transparent 40px 100px);background-size:200px 200px,900px 640px,auto,auto,auto,auto;box-shadow:0 0 0 13px #AEB3AC,0 0 0 15px #858A83,0 34px 70px 16px rgba(70,58,36,.32)}
#frame::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;background:linear-gradient(112deg,transparent 0 18%,rgba(255,240,205,.055) 21% 33%,transparent 36% 39%,rgba(255,240,205,.045) 42% 52%,transparent 56%)}
#tray{position:absolute;height:48px}
#tray .ledge{position:absolute;left:0;right:0;bottom:0;height:30px;border-radius:2px;background:linear-gradient(180deg,#EEF0EB 0,#C3C7C0 25%,#9CA19A 72%,#7C817A 100%);box-shadow:0 10px 16px rgba(70,58,36,.28)}
.pc{position:absolute;bottom:30px;height:12px;border-radius:3px 6px 6px 3px;background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),inset 0 2px 0 rgba(255,255,255,.45)}
.eraser{position:absolute;bottom:30px;width:104px;height:28px;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,#3A4A73 0,#2B3758 66%,#CFC9BC 66%,#B5AE9F 100%);box-shadow:0 2px 3px rgba(0,0,0,.3)}
#from{position:absolute;font-family:var(--hand);font-weight:700;font-size:40px;line-height:1;white-space:nowrap;color:rgba(242,239,230,.92);transform:translate(-100%,-100%) rotate(-2deg)}
#deco .dc{position:absolute;color:var(--c);opacity:.8;transform:translate(-50%,-50%) rotate(var(--rot))}
#deco .dc svg{width:var(--ds);height:var(--ds)}

#cluster{position:absolute;left:-560px;top:-290px;width:1120px;height:560px;pointer-events:none}
#cluster>*{position:absolute}
.c-title{left:560px;top:44px;transform:translateX(-50%) rotate(-2deg);font-family:var(--hand);font-weight:700;line-height:1;white-space:nowrap}
.c-title .to{font-size:56px;color:var(--yellow);margin-right:18px}
.c-title .who{font-size:134px;letter-spacing:-.01em}
.c-uline{left:300px;top:184px;width:520px;height:30px;color:var(--yellow);transform:rotate(-1deg)}
.c-uline path{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round}
.c-names{left:560px;top:224px;transform:translateX(-50%);font-family:var(--hand);font-size:33px;color:rgba(242,239,230,.88);white-space:nowrap;word-spacing:.3em}
.c-pil{left:214px;top:290px;width:694px;display:flex;align-items:stretch;transform:rotate(-1deg)}
.c-pil .bx{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;color:var(--pink)}
.c-pil .bx path{fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.c-pil .pl{flex:none;width:138px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--ui);font-weight:800;font-size:25px;line-height:1.3;letter-spacing:.04em;color:var(--pink)}
.c-pil .pr{flex:1;min-width:0;padding:18px 26px 16px 24px}
.c-pil .v{font-family:var(--ui);font-weight:700;font-size:25px;line-height:1.45;letter-spacing:.02em}
.c-pil .rf:empty{display:none}
.c-pil .rf{margin-top:2px;text-align:right;font-family:var(--hand);font-weight:700;font-size:21px;color:var(--yellow)}
.c-pil .cp{margin-top:10px;padding-top:6px;border-top:2px dashed rgba(242,162,182,.65);font-family:var(--pen);font-size:44px;line-height:1.08}
.c-d{color:var(--chalk)}
svg.c-d{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.c-d svg{display:block;width:100%;height:100%;overflow:visible}
.c-d path,.c-d circle,.c-d ellipse{fill:none;stroke:currentColor;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}

#items .it,#ghost{position:absolute;left:0;top:0}
.it{transform:translate(-50%,-50%) rotate(var(--rot,0deg));transition:opacity .5s}
.it.pre{opacity:0}
.it.hid{visibility:hidden}
.note{display:block;width:max-content;max-width:var(--mw,300px);padding:6px 10px;text-align:left;color:var(--c);font-family:var(--f);font-size:var(--fs);line-height:1.22}
.note .ink{display:block;white-space:pre-wrap;overflow-wrap:anywhere}
.note .by{font-size:.66em;opacity:.82;white-space:nowrap}
.note.mine .by{text-decoration:underline dotted;text-underline-offset:3px}
.dood{display:flex;flex-direction:column;align-items:center;color:var(--c);padding:4px}
.dood svg{width:var(--ds);height:var(--ds)}
.dood em{margin-top:-2px;font-style:normal;font-family:var(--hand);font-weight:700;font-size:calc(var(--ds)*.25);white-space:nowrap}
.draw path{fill:none;stroke:currentColor;stroke-width:34;stroke-linecap:round;stroke-linejoin:round}
.it.writing .ink,.it.writing svg{animation:write 1.2s ease-out both}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
#ghost{z-index:5;outline:2px dashed rgba(243,212,107,.9);outline-offset:6px;border-radius:6px}
#ghost.bad{outline-color:#F28B9E}
body.placing #items .it{opacity:.45}
body.placing #deco{opacity:.3}

#gate{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center;background:var(--board);font-family:var(--hand);font-size:25px;line-height:1.45;white-space:pre-line;z-index:50}
#gate button{padding:10px 22px;border:2px solid rgba(242,239,230,.6);border-radius:99px;font-family:var(--ui);font-size:15px}
#ctl{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:15;display:flex;gap:6px}
#ctl .ic{width:40px;padding:0;justify-content:center}
body.placing #shotBtn,body.placing #pickBtn{display:none}
#world.flat .it{transform:translate(-50%,-50%)!important}
#world.flat .c-title{transform:translateX(-50%)!important}
#world.flat .c-pil{transform:none!important}
#world.flat #from{transform:translate(-100%,-100%)!important}
#gate p{animation:breath 1.6s ease-in-out infinite alternate}
@keyframes breath{from{opacity:.55}}
#ctl button{height:40px;padding:0 14px 0 11px;display:flex;align-items:center;gap:7px;border:1.5px solid rgba(242,239,230,.4);border-radius:20px;background:rgba(30,50,41,.88);font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
#ctl svg{width:18px;height:18px}
#chip{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));z-index:15;width:max-content;max-width:92vw;transform:translateX(-50%);padding:10px 18px;border-radius:16px;background:rgba(30,50,41,.92);border:1.5px solid rgba(242,239,230,.35);font-size:14px;line-height:1.5;text-align:center;white-space:nowrap;transition:opacity .5s;pointer-events:none}
body.writer #chip{bottom:calc(96px + env(safe-area-inset-bottom))}

#zoom{position:fixed;left:0;top:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;background:rgba(10,18,14,.66);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.zb{position:relative;width:100%;max-width:440px;padding:30px 24px 20px;border:7px solid #B3B8B1;border-radius:6px;background-color:var(--board);background-image:var(--dust);box-shadow:0 26px 60px rgba(0,0,0,.5);outline:0;color:var(--c)}
.zb.pop{animation:pop .4s cubic-bezier(.2,.85,.3,1.15) both}
.zb.turn{animation:turn .28s ease both}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes turn{from{opacity:0;transform:translateX(var(--tx,24px))}}
.zt{max-height:52vh;overflow-y:auto;overscroll-behavior:contain;font-family:var(--f);font-size:calc(30px*var(--s));line-height:1.24;white-space:pre-wrap;overflow-wrap:anywhere;text-shadow:0 0 1px currentColor}
.zf{display:flex;align-items:flex-end;gap:12px;margin-top:12px}
.zby{margin-left:auto;text-align:right;font-family:var(--f);font-size:calc(22px*var(--s));opacity:.85}
.zd{display:flex;flex-direction:column;align-items:center;margin:0 auto}
.zd svg{width:150px;height:150px}
.zd em{font-style:normal;font-family:var(--hand);font-weight:700;font-size:30px}
.ztools{display:flex;gap:16px;align-items:center;margin-top:14px;padding-top:10px;border-top:1px dashed rgba(242,239,230,.3);font-size:13.5px;color:rgba(242,239,230,.72)}
.ztools span{margin-right:auto}
.ztools button{padding:6px 2px;color:var(--chalk);text-decoration:underline;text-underline-offset:3px}
.pager{display:flex;align-items:center;gap:22px;font-family:var(--hand);font-size:21px}
.pager button{width:48px;height:48px;border:2px solid rgba(242,239,230,.5);border-radius:50%;font-family:var(--ui);font-size:24px;line-height:1}
.pager button:disabled{opacity:.25}
.x{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top));width:46px;height:46px;font-size:20px;color:var(--chalk)}

.sheet{position:fixed;left:0;top:0;right:0;bottom:0;z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#E6E1D4}
.sh{position:relative;max-width:480px;min-height:100%;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));background:var(--paper);color:var(--ink);font-family:var(--print)}
.sh .x{color:var(--ink)}
.sh-h{margin:26px 0 14px;text-align:center;color:var(--omr)}
.sh-h b{display:block;font-size:21px;letter-spacing:.05em}
.sh-h span{display:inline-block;margin-top:7px;padding:2px 12px;border:1.5px solid var(--omr);font-size:13.5px;letter-spacing:.08em}
.pvb{position:relative;min-height:190px;padding:34px 20px 22px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:6px solid #B3B8B1;background-color:var(--board);background-image:var(--dust)}
.pvb .it{position:relative;left:auto;top:auto;transform:rotate(var(--rot,0deg));transition:none}
.pvb .note{max-width:100%}
.rows{margin-top:14px;border:1.5px solid var(--omr)}
.row{display:flex;border-top:1px solid rgba(194,58,67,.55)}
.row:first-child{border-top:0}
.row>.lb{flex:none;width:58px;display:flex;align-items:center;justify-content:center;background:#FBE7E4;border-right:1px solid rgba(194,58,67,.55);color:var(--omr);font-weight:700;font-size:14px}
.row>.ct{display:block;flex:1;min-width:0;padding:10px}
.ct input,.ct textarea{display:block;width:100%;padding:9px 10px;border:1px solid rgba(29,29,34,.28);border-radius:4px;background:#fff;font-family:var(--ui);font-size:16px;line-height:1.45;resize:none;-webkit-appearance:none;appearance:none}
.ct textarea{min-height:120px}
.ct input:focus,.ct textarea:focus{outline:0;border-color:var(--omr);box-shadow:0 0 0 2px rgba(194,58,67,.15)}
.ct ::placeholder{color:#9a979e}
.cnt{display:block;margin-top:4px;text-align:right;font-family:var(--ui);font-size:12px;color:#6f6c74}
.sticks{display:flex;justify-content:space-between;align-items:flex-end;height:60px;padding:0 6px;border-radius:3px;background:linear-gradient(180deg,transparent 0 72%,#C9CDC6 72%,#9CA19A 100%)}
.sticks button{width:42px;height:56px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:17px}
.sticks i{display:block;width:34px;height:11px;border-radius:2px 5px 5px 2px;background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),inset 0 2px 0 rgba(255,255,255,.45),0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sticks button[aria-pressed=true] i{transform:translateY(-20px) rotate(-14deg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-width:56px;height:46px;padding:0 9px;display:flex;align-items:center;justify-content:center;border:2px solid transparent;border-radius:6px;background:var(--board);color:var(--c)}
.chips button[aria-pressed=true]{border-color:var(--omr);box-shadow:0 0 0 2px rgba(194,58,67,.22)}
.chips .fs{font-size:calc(21px*var(--s));line-height:1}
.chips svg{width:30px;height:30px}
.chips.five button{min-width:0;width:calc(20% - 5px);padding:0}
.chips.sz button{font-family:var(--ui);font-size:14px;color:var(--chalk)}
.tabs{display:flex;margin-top:4px;border:1.5px solid var(--omr);border-radius:6px;overflow:hidden}
.tabs button{flex:1;height:44px;color:var(--omr);font-weight:700;font-size:15px}
.tabs button[aria-pressed=true]{background:var(--omr);color:#fff}
.padw{position:relative;margin-top:12px;border:6px solid #B3B8B1;background-color:var(--board);background-image:var(--dust)}
#pad{display:block;width:100%;height:auto;aspect-ratio:1/1;touch-action:none;cursor:crosshair}
#pad path{fill:none;stroke:var(--c);stroke-width:34;stroke-linecap:round;stroke-linejoin:round}
.padtip{position:absolute;left:0;right:0;top:44%;text-align:center;font-family:var(--hand);font-size:22px;color:rgba(242,239,230,.55);pointer-events:none}
#padClear{position:absolute;right:8px;bottom:8px;padding:6px 12px;border-radius:14px;background:rgba(242,239,230,.14);color:var(--chalk);font-size:13px}
.go{display:block;width:100%;height:54px;margin-top:18px;border-radius:27px;background:var(--board);color:var(--chalk);font-family:var(--ui);font-size:17px;font-weight:700}
.err{min-height:1.5em;margin-top:10px;text-align:center;font-family:var(--ui);font-size:14px;color:var(--omr)}

#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:8px;padding:22px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(30,50,41,0),rgba(30,50,41,.9) 40%)}
#bar button{height:52px;padding:0 18px;border:2px solid rgba(242,239,230,.45);border-radius:26px;background:rgba(32,54,45,.88);font-size:15.5px;white-space:nowrap}
#bar .go1{flex:1;max-width:240px;border-color:transparent;background:var(--yellow);color:#22372D;font-weight:700}
#bar button:disabled{opacity:.42}
#hint{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));z-index:20;width:max-content;max-width:94vw;transform:translateX(-50%);padding:9px 16px;border:1.5px solid rgba(242,239,230,.35);border-radius:99px;background:rgba(24,40,33,.94);font-size:14px;text-align:center}
#hint.bad{border-color:#F28B9E;color:#F9C9D3}
body.placing #ctl{top:calc(64px + env(safe-area-inset-top))}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));z-index:40;width:max-content;max-width:88vw;padding:11px 18px;border-radius:12px;background:rgba(251,248,240,.97);color:var(--ink);font-size:14.5px;text-align:center;opacity:0;transform:translate(-50%,12px);transition:opacity .3s,transform .3s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.dust{position:fixed;left:0;top:0;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--c);pointer-events:none;z-index:25;transition:transform .9s ease-out,opacity .9s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  var seen = load("tip", 0), chip = $("#chip");
  function tip() {
    if (seen) return;
    save("tip", 1); chip.textContent = "밀어서 둘러보고, 두 손가락으로 키워 봐" + NL + "글씨를 누르면 크게 보여";
    chip.style.whiteSpace = "pre-line"; chip.hidden = false; chip.style.opacity = "1";
    setTimeout(function () { chip.style.opacity = "0"; setTimeout(function () { chip.hidden = true; }, 600); }, 5200);
  }
  homeView(false);
  if (reduce) return tip();
  /* 분필로 써 내려가듯: 제목 -> 이름 -> 필적 확인란 -> 그림 -> 선배들 글 */
  var t = 0.15, list = [], total;
  function wr(e, d, dur) { if (!e) return; e.style.animation = "write " + (dur || 0.8) + "s ease-out " + d.toFixed(2) + "s both"; list.push(e); }
  wr($("#cTitle"), t, 0.9); wr($(".c-uline"), t + 0.55, 0.6); wr($("#names"), t + 0.9, 0.7); wr($("#pil"), t + 1.25, 0.9);
  each("#cluster .c-d", function (e, i) { wr(e, t + 1.5 + i * 0.07, 0.6); });
  var its = Array.prototype.slice.call(D.querySelectorAll("#items .it")).sort(function (a, b) { return Math.hypot(+a.dataset.x / 1.6, +a.dataset.y) - Math.hypot(+b.dataset.x / 1.6, +b.dataset.y); });
  var stepT = Math.min(0.08, 2.4 / Math.max(1, its.length));
  its.forEach(function (b, i) { wr(b, t + 2.1 + i * stepT, 0.7); });
  total = t + 2.1 + its.length * stepT + 0.8;
  wr($("#from"), total - 0.6, 0.7);
  $("#deco").style.animation = "fade 1.2s ease " + (t + 1.9).toFixed(2) + "s both";
  setTimeout(function () { list.forEach(function (e) { e.style.animation = ""; }); $("#deco").style.animation = ""; tip(); }, total * 1000 + 300);
}
function showBoard(d, src) {
  $("#gate").hidden = true; $("#ctl").hidden = false;
  apply(d, src, true);
  if (D.fonts && D.fonts.ready) D.fonts.ready.then(function () { layout(); });
  intro();
}
function boot() {
  var q = {};
  location.hash.slice(1).split("&").forEach(function (p) { var i = p.indexOf("="); if (i > 0) try { q[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); } catch (e) {} });
  S.h = q;
  if (!q.r) return gate("받은 QR이나 링크로 들어와 주세요.");
  if (!(window.crypto && crypto.subtle && window.TextEncoder)) return gate("이 브라우저에서는 열 수 없어요." + NL + "다른 브라우저로 열어 주세요.");
  S.mine = load("mine", {});
  makeKeys(q.r).then(function (k) {
    var done = false, live, snap, t;
    S.k = k; S.key = q.a || q.w || k.api;
    live = liveSky(); snap = snapSky();
    snap.catch(function () {});
    function first(d, src) { if (done) return; done = true; showBoard(d, src); }
    t = setTimeout(function () { snap.then(function (d) { first(d, "snap"); }).catch(function () {}); }, 1500);
    live.then(function (d) {
      clearTimeout(t);
      if (!done) first(d, "live"); else apply(d, "live", false);
      S.poll = setInterval(refresh, 20000);
    }).catch(function () {
      clearTimeout(t);
      if ((q.w || q.a) && !done) toast("지금은 칠판에 쓸 수 없어요. 보기만 할 수 있어요.");
      snap.then(function (d) { first(d, "snap"); }).catch(function () { if (!done) gate("칠판을 불러오지 못했어요." + NL + "받은 링크로 다시 열거나" + NL + "인터넷 연결을 확인해 주세요.", true); });
    });
  }).catch(function () { gate("칠판을 열지 못했어요.", true); });
}

Object.keys(CHALK).forEach(function (c) {
  ["#fColor", "#dColor"].forEach(function (sel) {
    var b = el("button"), i = el("i"); b.type = "button"; b.dataset.v = c; b.setAttribute("aria-label", CHALK_KO[c]); i.style.setProperty("--c", CHALK[c]); b.appendChild(i);
    b.onclick = function () { S.draft.color = c; if (sel === "#fColor") syncNote(); else syncDoodle(); };
    $(sel).appendChild(b);
  });
});
Object.keys(FONTS).forEach(function (f) {
  var b = el("button"), s = el("span", "fs", "화이팅"); b.type = "button"; b.dataset.v = f; b.setAttribute("aria-label", FONTS[f][2] + " 글씨");
  s.style.fontFamily = FONTS[f][0]; s.style.setProperty("--s", FONTS[f][1]); b.appendChild(s);
  b.onclick = function () { S.draft.font = f; syncNote(); };
  $("#fFont").appendChild(b);
});
Object.keys(STAMPS).forEach(function (k) {
  var b = el("button"); b.type = "button"; b.dataset.v = k; b.setAttribute("aria-label", STAMPS[k][0] + (STAMPS[k][1] ? " (" + STAMPS[k][1] + ")" : "")); b.appendChild(stamp(k));
  b.onclick = function () { S.draft.shape = k; syncDoodle(); };
  $("#dStamp").appendChild(b);
});
SIZES.forEach(function (z) {
  var b = el("button", "", z[2]); b.type = "button"; b.dataset.v = z[1];
  b.onclick = function () { S.draft.size = z[1]; syncDoodle(); };
  $("#dSize").appendChild(b);
});
$("#tStamp").onclick = function () { S.draft.tab = "stamp"; syncDoodle(); };
$("#tDraw").onclick = function () { S.draft.tab = "draw"; syncDoodle(); padRender(); };
$("#fNick").oninput = $("#fBody").oninput = syncNote;
$("#fGo").onclick = stepPlace;
$("#dGo").onclick = stepPlace;
$("#sX").onclick = $("#dX").onclick = $("#zX").onclick = function () { back(); };
$("#zPrev").onclick = function () { step(-1); };
$("#zNext").onclick = function () { step(1); };
$("#gate button").onclick = function () { location.reload(); };
$("#zoom").addEventListener("click", function (e) { if (e.target === this) back(); });
D.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && layers.length) back();
  if (S.zoom && e.key === "ArrowLeft") step(-1);
  if (S.zoom && e.key === "ArrowRight") step(1);
});
(function () {
  var x0 = 0, y0 = 0, zb = $("#zb");
  zb.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  zb.addEventListener("touchend", function (e) {
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy) * 1.6) step(dx < 0 ? 1 : -1);
  }, { passive: true });
})();
var rz = 0;
window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(function () { if ($("#gate").hidden) { clampView(); applyView(false); } }, 120); });
D.addEventListener("visibilitychange", function () { if (!D.hidden) refresh(); });
try { history.scrollRestoration = "manual"; } catch (e) {}
makeGrain(); boot();
})();
</script>
